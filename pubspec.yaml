name: aloulou_chat
description: AI Chat Assistant with Gemini integration and MVVM architecture

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 📦 State Management
  provider: ^6.1.1

  # 🔥 Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  firebase_auth: ^4.16.0
  cloud_functions: ^4.5.12
  webview_flutter: ^4.4.2

  # 🤖 AI Services
  google_generative_ai: ^0.4.0

  # 🌐 Network
  http: ^1.1.0
  connectivity_plus: ^5.0.2

  # 💾 Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 🖼️ UI & UX
  cupertino_icons: ^1.0.2
  dash_chat_2: ^0.0.21
  chat_gpt_sdk: ^3.1.5
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  flutter_markdown: ^0.7.7+1 
  uuid: ^4.2.1
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  
  flutter_svg: ^2.0.9
  flutter_spinkit: ^5.2.0
  lottie: ^2.7.0

  # 🧭 Navigation
  go_router: ^12.1.3

  # 🛠 Utils
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.1.0
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  google_sign_in: ^5.4.4
  path_provider: ^2.1.1
  path: ^1.8.3
  crypto: ^3.0.3

  # 💳 Payments
  flutter_stripe: ^10.1.1
  get_it: ^8.2.0
  
  # 🎵 Audio & File Handling (Stable alternatives)
  audioplayers: ^5.2.1
  record: ^6.0.1
  just_audio: ^0.9.36
  file_picker: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/icons/google_logo.png
    - .env
